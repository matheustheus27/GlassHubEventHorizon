<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Neon Gradients -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="magentaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="eventHorizonCore" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#050714" />
      <stop offset="95%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.8" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glassmorphic Rounded Card Container (Transparent Background) -->
  <rect x="12" y="12" width="176" height="176" rx="40" 
        fill="rgba(30, 41, 59, 0.35)" 
        stroke="url(#glassBorder)" 
        stroke-width="1.8" />

  <g transform="translate(100, 100)">
    <!-- Back Accretion Disk Ring -->
    <ellipse cx="0" cy="0" rx="72" ry="26" transform="rotate(-28)"
             fill="none" stroke="url(#magentaGradient)" stroke-width="4"
             filter="url(#neonGlowMagenta)" opacity="0.85" />

    <!-- Inner Orbital Glow Stream -->
    <ellipse cx="0" cy="0" rx="60" ry="20" transform="rotate(-28)"
             fill="none" stroke="url(#cyanGradient)" stroke-width="3"
             filter="url(#neonGlowCyan)" />

    <!-- Black Hole Singularity Core -->
    <circle cx="0" cy="0" r="36" fill="url(#eventHorizonCore)" />
    <circle cx="0" cy="0" r="37" fill="none" stroke="#00F2FE" stroke-width="1.5" filter="url(#neonGlowCyan)" />

    <!-- Front Accretion Disk Swirl -->
    <path d="M -68,14 A 72,26 0 0,0 68,-14" transform="rotate(-28)"
          fill="none" stroke="url(#cyanGradient)" stroke-width="5.5" stroke-linecap="round"
          filter="url(#neonGlowCyan)" />

    <!-- Bright Photon Flare Highlights -->
    <circle cx="-52" cy="24" r="2.5" fill="#FFFFFF" filter="url(#neonGlowCyan)" />
    <circle cx="54" cy="-22" r="2" fill="#FFFFFF" filter="url(#neonGlowMagenta)" />
  </g>
</svg>
