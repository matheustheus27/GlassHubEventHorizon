# Taskfile.yml - GlassHub Event Horizon
# Docs: https://taskfile.dev
version: "3"

vars:
  SOLUTION:    GlassHubEventHorizon.slnx
  GUI_PROJ:    src/GlassHub.EventHorizon.GUI/GlassHub.EventHorizon.GUI.csproj
  CLI_PROJ:    src/GlassHub.EventHorizon.CLI/GlassHub.EventHorizon.CLI.csproj
  CONFIG:      Release
  DIST:        publish/win-x64
  APP_NAME:    GlassHub.EventHorizon
  APP_VERSION: 1.0.0
  ISS_SCRIPT:  installer.iss

tasks:

  default:
    desc: Lista todas as tarefas disponíveis
    cmds:
      - task --list

  # --- RESTORE ---
  restore:
    desc: Restaurar dependências NuGet da solução
    cmds:
      - dotnet restore {{.SOLUTION}}

  # --- BUILD ---
  build:
    desc: Build Debug da solução
    deps: [restore]
    cmds:
      - dotnet build {{.SOLUTION}} --no-restore -c Debug

  build:release:
    desc: Build Release da solução
    deps: [restore]
    cmds:
      - dotnet build {{.SOLUTION}} --no-restore -c {{.CONFIG}}

  # --- TEST ---
  test:
    desc: Executar verificação e testes
    deps: [restore]
    cmds:
      - dotnet test {{.SOLUTION}} --no-restore -c {{.CONFIG}} --logger "console;verbosity=normal"

  # --- LINT / FORMAT ---
  lint:
    desc: Verificar formatação do código (dotnet format --verify)
    cmds:
      - dotnet format {{.SOLUTION}} --verify-no-changes --severity warn

  format:
    desc: Aplicar formatação automática no código
    cmds:
      - dotnet format {{.SOLUTION}} --severity warn

  # --- CLEAN ---
  clean:
    desc: Limpar artefatos de build (bin, obj, publish, dist, setup_output)
    cmds:
      - dotnet clean {{.SOLUTION}}
      - cmd /c "if exist publish rmdir /s /q publish"
      - cmd /c "if exist dist rmdir /s /q dist"
      - cmd /c "if exist setup_output rmdir /s /q setup_output"

  # --- RUN ---
  run:gui:
    desc: Executar a GUI Desktop (WPF Windows 11) em modo Debug
    cmds:
      - dotnet run --project {{.GUI_PROJ}} -c Debug

  run:cli:
    desc: Executar a CLI evh (use ARG="..." para passar parâmetros)
    cmds:
      - dotnet run --project {{.CLI_PROJ}} -c Debug -- {{.ARG}}

  # --- PUBLISH ---
  publish:gui:
    desc: Publicar GUI self-contained single-file win-x64
    deps: [build:release]
    cmds:
      - >-
        dotnet publish {{.GUI_PROJ}}
        -c {{.CONFIG}}
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o {{.DIST}}

  publish:cli:
    desc: Publicar CLI self-contained single-file win-x64
    deps: [build:release]
    cmds:
      - >-
        dotnet publish {{.CLI_PROJ}}
        -c {{.CONFIG}}
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o {{.DIST}}

  publish:
    desc: Executar pipeline de publicação completa (GUI + CLI + Assets via publish.ps1)
    cmds:
      - pwsh -File publish.ps1 -NoInnoSetup

  publish:all:
    desc: Publicar GUI + CLI na pasta de distribuição
    deps: [publish:gui, publish:cli]
    cmds:
      - echo "Publicacao concluida em {{.DIST}}/"

  # --- INSTALLER (Inno Setup) ---
  installer:
    desc: Gerar instalador Windows (.exe) via Inno Setup
    deps: [publish:all]
    cmds:
      - pwsh -File publish.ps1

  # --- PIPELINE COMPLETO ---
  all:
    desc: "Pipeline completo: restore -> build -> test -> publish -> installer"
    cmds:
      - task: restore
      - task: build:release
      - task: publish
