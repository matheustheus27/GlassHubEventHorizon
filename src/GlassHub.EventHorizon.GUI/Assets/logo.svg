<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="60%" stop-color="#070B13" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Cosmic Glow Gradients -->
    <linearGradient id="cosmicRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8054FF" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="photonArcGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#8054FF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8054FF" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="singularityCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="85%" stop-color="#03050A" />
      <stop offset="100%" stop-color="#0B132B" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="photonSphereGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Rounded Squircle Card -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#spaceGradient)" />

  <!-- Outer Glass Frame -->
  <rect x="12" y="12" width="176" height="176" rx="40" 
        fill="rgba(14, 22, 38, 0.45)" 
        stroke="url(#glassBorder)" 
        stroke-width="1.5" />

  <!-- Inner Glass Panel Layer (3D Depth) -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  <circle cx="100" cy="100" r="64" fill="none" stroke="rgba(0, 229, 255, 0.18)" stroke-width="1" />

  <!-- Warped Photon Sphere Ring (Trapped Light) -->
  <circle cx="100" cy="100" r="54" fill="none" 
          stroke="url(#cosmicRingGradient)" stroke-width="6" 
          filter="url(#photonSphereGlow)" opacity="0.95" />

  <!-- Photon Crescent Flare -->
  <path d="M 62 100 A 38 38 0 0 1 138 100 A 38 38 0 0 0 62 100" 
        fill="url(#photonArcGradient)" 
        filter="url(#subtleGlow)" opacity="0.9" />

  <!-- Black Hole Singularity Silhouette Core -->
  <circle cx="100" cy="100" r="42" fill="url(#singularityCore)" />
  <circle cx="100" cy="100" r="42.5" fill="none" stroke="rgba(0, 229, 255, 0.6)" stroke-width="1.2" />

  <!-- Internal Horizon Shadow Curve -->
  <path d="M 64 105 Q 100 132 136 105" fill="none" stroke="rgba(128, 84, 255, 0.4)" stroke-width="2" />

  <!-- Specular Lens Highlights on Glass Panel -->
  <ellipse cx="68" cy="48" rx="28" ry="12" transform="rotate(-30 68 48)" fill="rgba(255, 255, 255, 0.08)" />
</svg>
